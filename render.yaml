services:
  - type: web
    name: student-infosys-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: student_infosys
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
